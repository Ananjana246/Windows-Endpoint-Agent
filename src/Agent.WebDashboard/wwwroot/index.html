<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Endpoint Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f4f6f8;
            color: #1f2937;
        }

        h1 {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 35px;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
        }

        .device {
            font-size: 14px;
            word-break: break-all;
        }

        .updated {
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        }

        .events {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .event {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .event:last-child {
            border-bottom: none;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 8px;
        }

        .event-type {
            font-weight: bold;
        }

        .event-source {
            color: #6b7280;
            font-size: 13px;
        }

        .event-time {
            color: #6b7280;
            font-size: 12px;
            white-space: nowrap;
        }

        .event-data {
            font-size: 13px;
            color: #4b5563;
            word-break: break-word;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <h1>Windows Endpoint Agent</h1>

    <div>
        Agent Status:
        <span id="status" class="status">Loading...</span>
    </div>

    <div class="grid">

        <div class="card">
            <div class="label">Device ID</div>
            <div id="deviceId" class="value device">Loading...</div>
        </div>

        <div class="card">
            <div class="label">Total Events</div>
            <div id="totalEvents" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">Ready Events</div>
            <div id="readyEvents" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">Collectors</div>
            <div id="collectorCount" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">Database</div>
            <div id="databaseHealthy" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">Last Collection</div>
            <div id="lastCollection" class="value device">-</div>
        </div>

    </div>

    <h2>Live Event Feed</h2>

    <div id="events" class="events">
        <div class="empty">Loading events...</div>
    </div>

    <div class="updated">
        Last dashboard refresh:
        <span id="refreshTime">-</span>
    </div>

    <script>

            function getEventTypeName(eventType) {
            const eventTypes = {
                0: "Agent Started",
                1: "Agent Stopped",
                2: "Agent Error",
                3: "System Info",
                4: "User Login",
                5: "User Logout",
                6: "Workstation Lock",
                7: "Workstation Unlock",
                8: "Process Started",
                9: "Process Stopped",
                10: "File Created",
                11: "File Modified",
                12: "File Renamed",
                13: "File Deleted"
                };

            return eventTypes[eventType] || `Event ${eventType}`;
}

        function formatEventData(data) {
            try {
                const parsed = JSON.parse(data);
                return JSON.stringify(parsed, null, 2);
            }
            catch {
                return data;
            }
        }

        async function loadHealth() {
            try {
                const response = await fetch('/health');

                if (!response.ok) {
                    throw new Error('Health request failed');
                }

                const health = await response.json();

                document.getElementById('status').textContent =
                    health.status;

                document.getElementById('deviceId').textContent =
                    health.deviceId;

                document.getElementById('totalEvents').textContent =
                    health.totalEvents;

                document.getElementById('readyEvents').textContent =
                    health.readyEvents;

                document.getElementById('collectorCount').textContent =
                    health.collectorCount;

                document.getElementById('databaseHealthy').textContent =
                    health.databaseHealthy
                        ? 'Healthy'
                        : 'Unhealthy';

                document.getElementById('lastCollection').textContent =
                    health.lastCollectionUtc ===
                    '0001-01-01T00:00:00'
                        ? 'Not available'
                        : new Date(
                            health.lastCollectionUtc
                          ).toLocaleString();

                document.getElementById('refreshTime').textContent =
                    new Date().toLocaleString();
            }
            catch (error) {
                document.getElementById('status').textContent =
                    'OFFLINE';

                console.error(error);
            }
        }

        async function loadEvents() {
            try {
                const response = await fetch('/events');

                if (!response.ok) {
                    throw new Error('Events request failed');
                }

                const events = await response.json();

                const container =
                    document.getElementById('events');

                if (events.length === 0) {
                    container.innerHTML =
                        '<div class="empty">No events available.</div>';

                    return;
                }

                container.innerHTML = events.map(event => {

                    const eventType =
                        getEventTypeName(event.eventType);

                    const timestamp =
                        new Date(
                            event.timestampUtc
                        ).toLocaleString();

                    return `
                        <div class="event">
                            <div class="event-header">
                                <div>
                                    <span class="event-type">
                                        ${eventType}
                                    </span>

                                    <span class="event-source">
                                        — ${event.source}
                                    </span>
                                </div>

                                <div class="event-time">
                                    ${timestamp}
                                </div>
                            </div>

                            <div class="event-data">
                                ${formatEventData(event.data)}
                            </div>
                        </div>
                    `;
                }).join('');
            }
            catch (error) {
                document.getElementById('events').innerHTML =
                    '<div class="empty">Unable to load events.</div>';

                console.error(error);
            }
        }

        async function refreshDashboard() {
            await loadHealth();
            await loadEvents();
        }

        refreshDashboard();

        setInterval(refreshDashboard, 5000);

    </script>

</body>
</html>
